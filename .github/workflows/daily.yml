name: daily-radar

on:
  schedule:
    # 18:17 KST = 09:17 UTC. 정각은 GitHub 스케줄러가 혼잡해 지연이 크다.
    # 초록 수집은 매일, Gemini 분석은 금요일에만 (scripts/daily.py의 GEMINI_WEEKDAY).
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      force_gemini:
        description: "Gemini 분석을 요일과 무관하게 강제로 실행"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and analyse
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_TOOL_EMAIL: ${{ secrets.NCBI_TOOL_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FORCE: ${{ inputs.force_gemini && '1' || '' }}
          # 판정 교차 검증용. 둘 다 없어도 돌아간다(두 번째 Gemini 모델만으로 합의를 잰다).
          GEMINI_JUDGE_MODEL_B: ${{ vars.GEMINI_JUDGE_MODEL_B }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_JUDGE_MODEL: ${{ vars.OPENAI_JUDGE_MODEL }}
        run: python scripts/daily.py
      - name: Commit snapshot
        # 실행 기록은 스크립트가 실패해도 남기므로, 실패한 날도 커밋해 앱 사이드바에 보이게 한다.
        if: always()
        run: |
          set -euo pipefail
          git add -A data/daily.json data/run_log.json data/run_manifest.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋을 건너뜁니다."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 일일 무릎 연구 레이더 갱신 ($(date -u +%Y-%m-%d))"
          git push
