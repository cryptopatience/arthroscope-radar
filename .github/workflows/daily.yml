name: daily-radar

on:
  schedule:
    # 18:17 KST = 09:17 UTC. 정각은 GitHub 스케줄러가 혼잡해 지연이 크다.
    # 초록 수집은 매일, Gemini 분석은 금요일에만 (scripts/daily.py의 GEMINI_WEEKDAY).
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      force_gemini:
        description: "Gemini 분석을 요일과 무관하게 강제로 실행"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 캐시가 비면 Gemini 단계가 순차로 90분 가까이 돈다(판정 1건이 주 판정 5회 +
    # 교차 1회로 60초 남짓, 판정만 40건). 모델을 바꾸면 캐시 키가 달라져 전부 새로 돈다.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and analyse
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_TOOL_EMAIL: ${{ secrets.NCBI_TOOL_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FORCE: ${{ inputs.force_gemini && '1' || '' }}
          # 판정 교차 검증용. 둘 다 없어도 돌아간다(두 번째 Gemini 모델만으로 합의를 잰다).
          GEMINI_JUDGE_MODEL_B: ${{ vars.GEMINI_JUDGE_MODEL_B }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_JUDGE_MODEL: ${{ vars.OPENAI_JUDGE_MODEL }}
        run: python scripts/daily.py
      # push가 거부되면 30~80분 걸린 AI 결과가 통째로 사라진다(2026-08-28에 실제로
      # 겪었다). 커밋 단계와 무관하게 결과물을 먼저 남겨 둔다.
      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: |
            data/daily.json
            data/run_log.json
            data/run_manifest.json
            data/trials.json
            data/trend_history.json
            data/briefing_history.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit snapshot
        # 실행 기록은 스크립트가 실패해도 남기므로, 실패한 날도 커밋해 앱 사이드바에 보이게 한다.
        if: always()
        run: |
          set -euo pipefail
          git add -A data/daily.json data/run_log.json data/run_manifest.json data/trials.json data/trend_history.json data/briefing_history.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋을 건너뜁니다."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 일일 무릎 연구 레이더 갱신 ($(date -u +%Y-%m-%d))"
          # 체크아웃 이후 사람이 main에 푸시하면 여기서 non-fast-forward로 거부되고,
          # 그때까지의 AI 작업이 통째로 버려진다. 원격을 당겨 rebase하고 다시 민다.
          # 데이터 파일만 건드리므로 충돌 여지가 거의 없다.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "푸시 완료 (시도 $attempt)"; exit 0
            fi
            echo "원격이 앞서 있습니다 — rebase 후 재시도 ($attempt/3)"
            git fetch origin main
            git rebase origin/main || { echo "rebase 실패 — 수동 확인 필요"; exit 1; }
          done
          echo "3회 시도 후에도 push 실패"; exit 1
